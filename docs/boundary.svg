<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Menlo, Consolas, monospace">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="#0a0a0b"/>

  <!-- title -->
  <text x="600" y="56" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#ffffff">MCP gives an agent context. EAP gives it a body.</text>

  <!-- ================= MCP: the conversation ================= -->
  <text x="86" y="112" font-size="12" letter-spacing="3" fill="#9a9a9a">MCP — THE CONVERSATION</text>

  <rect x="86" y="128" width="330" height="380" rx="12" fill="#141416" stroke="#333338"/>
  <circle cx="108" cy="150" r="4" fill="#2e2e33"/><circle cx="122" cy="150" r="4" fill="#2e2e33"/><circle cx="136" cy="150" r="4" fill="#2e2e33"/>

  <!-- user message -->
  <rect x="196" y="172" width="200" height="30" rx="8" fill="#232327"/>
  <text x="206" y="191" font-size="11" fill="#d8d8d8">walk over and point at it</text>

  <!-- tool call: the consent artifact -->
  <rect x="106" y="218" width="290" height="34" rx="8" fill="none" stroke="#4a4a52"/>
  <text x="118" y="239" font-size="11" fill="#bdbdbd">▸ stage_summon</text>
  <text x="386" y="239" font-size="11" fill="#ffffff" text-anchor="end">approved ✓</text>

  <rect x="106" y="262" width="290" height="34" rx="8" fill="none" stroke="#4a4a52"/>
  <text x="118" y="283" font-size="11" fill="#bdbdbd">▸ stage_point {app:"chrome"}</text>

  <!-- in-chat UI -->
  <rect x="106" y="312" width="290" height="120" rx="8" fill="#101012" stroke="#3a3a41" stroke-dasharray="5 4"/>
  <text x="251" y="366" font-size="11" fill="#8a8a8a" text-anchor="middle">in-chat UI</text>
  <text x="251" y="384" font-size="11" fill="#8a8a8a" text-anchor="middle">(MCP Apps iframe)</text>
  <text x="251" y="402" font-size="10" fill="#5a5a5a" text-anchor="middle">rendered inside the message</text>

  <text x="86" y="540" font-size="11" fill="#77777c">context · tools · resources · consent · elicitation</text>
  <text x="86" y="560" font-size="11" fill="#77777c">everything here lives inside the pane</text>

  <!-- ================= the boundary ================= -->
  <line x1="470" y1="96" x2="470" y2="596" stroke="#5c5c64" stroke-width="1.6" stroke-dasharray="7 7"/>
  <text x="459" y="336" font-size="11" letter-spacing="2" fill="#a8a8b0" transform="rotate(-90 459 336)">MCP STOPS AT THE PANE'S EDGE</text>

  <!-- the door, straddling the boundary -->
  <g filter="url(#softglow)">
    <rect x="452" y="360" width="38" height="78" fill="#0a0a0b" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="471" y1="360" x2="471" y2="438" stroke="#ffffff" stroke-width="1" opacity=".45"/>
    <circle cx="481" cy="401" r="2" fill="#ffffff"/>
  </g>

  <!-- ================= EAP: the screen ================= -->
  <text x="530" y="112" font-size="12" letter-spacing="3" fill="#9a9a9a">EAP — THE SCREEN</text>

  <!-- ground line -->
  <line x1="452" y1="438" x2="1150" y2="438" stroke="#26262b" stroke-width="1.4"/>

  <!-- window A: plain -->
  <g stroke="#45454c" fill="#121214">
    <rect x="590" y="150" width="240" height="150" rx="8"/>
    <line x1="590" y1="176" x2="830" y2="176"/>
    <circle cx="606" cy="163" r="3.5" fill="#2e2e33" stroke="none"/><circle cx="618" cy="163" r="3.5" fill="#2e2e33" stroke="none"/>
  </g>
  <text x="710" y="168" font-size="10" fill="#66666c" text-anchor="middle">a real app window</text>

  <!-- window B: spotlit -->
  <g filter="url(#glow)">
    <rect x="900" y="196" width="228" height="150" rx="8" fill="#121214" stroke="#ffffff" stroke-width="2"/>
  </g>
  <line x1="900" y1="222" x2="1128" y2="222" stroke="#7a7a80"/>
  <circle cx="916" cy="209" r="3.5" fill="#3a3a41"/><circle cx="928" cy="209" r="3.5" fill="#3a3a41"/>
  <text x="1014" y="368" font-size="10" fill="#8a8a90" text-anchor="middle">spotlit, moved, sat on — never clicked</text>

  <!-- the actor: stepped out of the door, mid-stride, pointing at window B -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#softglow)">
    <circle cx="560" cy="352" r="10" fill="#0a0a0b"/>
    <line x1="560" y1="362" x2="560" y2="400"/>            <!-- torso -->
    <line x1="560" y1="400" x2="546" y2="436"/>            <!-- back leg -->
    <line x1="560" y1="400" x2="577" y2="420"/>            <!-- front thigh -->
    <line x1="577" y1="420" x2="581" y2="438"/>            <!-- front shin -->
    <line x1="560" y1="372" x2="544" y2="394"/>            <!-- trailing arm -->
    <line x1="560" y1="372" x2="588" y2="360"/>            <!-- pointing arm -->
  </g>
  <!-- the beam -->
  <line x1="592" y1="358" x2="898" y2="270" stroke="#ffffff" stroke-width="1.6" opacity=".85" filter="url(#softglow)"/>
  <circle cx="900" cy="269" r="5" fill="#ffffff" opacity=".9" filter="url(#glow)"/>

  <text x="530" y="540" font-size="11" fill="#77777c">screen-space transforms · stages &amp; crossings · deixis · summon by consent</text>
  <text x="530" y="560" font-size="11" fill="#77777c">one body, one place at a time · the viewer can talk back · the actor never clicks</text>

  <!-- ================= the seam ================= -->
  <path d="M 400 236 C 470 236, 470 300, 520 348" stroke="#8f8f96" stroke-width="1.3" fill="none" stroke-dasharray="4 4"/>
  <path d="M 514 340 L 521 349 L 510 350 Z" fill="#8f8f96"/>
  <text x="600" y="606" text-anchor="middle" font-size="11" fill="#a8a8b0">the seam: EAP verbs bind as MCP tools (§6.8) — any MCP host is already a Director</text>

  <text x="1150" y="630" text-anchor="end" font-size="9" fill="#4a4a50">embodied-agent-protocol · draft 0.1</text>
</svg>
